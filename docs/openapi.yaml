openapi: 3.0.0
info:
  title: TaskFlow API
  version: 1.0.0
  description: Multi-tenant project and task management API implemented in this repository.
servers:
  - url: http://localhost:5000
    description: Local API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true
    AuthRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - organizationName
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        organizationName:
          type: string
        role:
          type: string
          enum: [platform_admin, org_admin, member]
          default: org_admin
    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 10
    ProjectCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
    ProjectUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
    TaskCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        dueDate:
          type: string
          nullable: true
    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        dueDate:
          type: string
          nullable: true
    TaskAssignmentRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
    BulkTaskStatusRequest:
      type: object
      required:
        - taskIds
        - status
      properties:
        taskIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum: [todo, in_progress, review, done]
    MemberAddRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    MemberRoleUpdateRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [org_admin, member]
  parameters:
    OrganizationIdParam:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectIdParam:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskIdParam:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberIdParam:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    TaskStatusQuery:
      name: status
      in: query
      schema:
        type: string
        enum: [todo, in_progress, review, done]
    TaskPriorityQuery:
      name: priority
      in: query
      schema:
        type: string
        enum: [low, medium, high, urgent]
    TaskAssigneeQuery:
      name: assignee
      in: query
      schema:
        type: string
        format: uuid
    DueDateFromQuery:
      name: dueDateFrom
      in: query
      schema:
        type: string
    DueDateToQuery:
      name: dueDateTo
      in: query
      schema:
        type: string
    SearchQuery:
      name: search
      in: query
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /api/auth/register:
    post:
      summary: Register a new user and organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '201':
          description: User created
        '409':
          description: Email already in use
  /api/auth/login:
    post:
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
  /api/auth/refresh:
    post:
      summary: Refresh an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
        '401':
          description: Refresh token invalid or revoked
  /api/auth/logout:
    post:
      summary: Revoke a refresh token for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logout successful
        '400':
          description: Refresh token missing
  /api/auth/logout-all:
    post:
      summary: Revoke all refresh tokens for the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All sessions revoked
  /api/platform/dashboard:
    get:
      summary: Platform admin dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform summary values
        '403':
          description: Forbidden
  /api/platform/organizations:
    get:
      summary: List organizations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization list
    post:
      summary: Create an organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                adminUserId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Organization created
  /api/platform/organizations/{organizationId}:
    get:
      summary: Get organization details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      responses:
        '200':
          description: Organization detail
        '404':
          description: Organization not found
    patch:
      summary: Update an organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Organization updated
    delete:
      summary: Delete an organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      responses:
        '204':
          description: Organization deleted
  /api/platform/users:
    get:
      summary: List users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users list
  /api/platform/users/{userId}:
    get:
      summary: Get a user by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User detail
        '404':
          description: User not found
    patch:
      summary: Update a user platform role
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - platformRole
              properties:
                platformRole:
                  type: string
                  enum: [user, platform_admin]
      responses:
        '200':
          description: User role updated
    delete:
      summary: Delete a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: User deleted
  /api/platform/organizations/{organizationId}/members:
    post:
      summary: Assign a user to an organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [org_admin, member]
                  default: member
      responses:
        '201':
          description: Membership created
        '409':
          description: User already is a member
  /api/platform/organizations/{organizationId}/members/{userId}/promote:
    patch:
      summary: Promote a user to org admin in an organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User promoted
        '404':
          description: User not found in organization
  /api/dashboard/org:
    get:
      summary: Organization admin dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization dashboard summary
        '403':
          description: Forbidden
  /api/dashboard/member:
    get:
      summary: Member dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Member dashboard summary
        '403':
          description: Forbidden
  /api/projects:
    get:
      summary: List projects in the current organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project list
    post:
      summary: Create a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Project created
  /api/projects/{projectId}:
    get:
      summary: Get a project by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Project detail
        '404':
          description: Project not found
    patch:
      summary: Update a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Project updated
    delete:
      summary: Delete a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Project deleted
  /api/tasks/projects/{projectId}:
    get:
      summary: List tasks in a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/TaskStatusQuery'
        - $ref: '#/components/parameters/TaskPriorityQuery'
        - $ref: '#/components/parameters/TaskAssigneeQuery'
        - $ref: '#/components/parameters/DueDateFromQuery'
        - $ref: '#/components/parameters/DueDateToQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated task list
    post:
      summary: Create a task in a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created
  /api/tasks/projects/{projectId}/dashboard:
    get:
      summary: Get task count dashboard for a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Task distribution by status
  /api/tasks/bulk-status:
    patch:
      summary: Update multiple tasks to the same status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTaskStatusRequest'
      responses:
        '200':
          description: Bulk status update result
  /api/tasks/{taskId}:
    get:
      summary: Get a task by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: Task detail
        '404':
          description: Task not found
    patch:
      summary: Update a task
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated
    delete:
      summary: Delete a task
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: Task deleted
  /api/tasks/{taskId}/assign:
    post:
      summary: Assign a user to a task
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignmentRequest'
      responses:
        '201':
          description: Assignment created
        '409':
          description: Task already assigned to user
  /api/tasks/{taskId}/unassign:
    post:
      summary: Unassign a user from a task
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignmentRequest'
      responses:
        '200':
          description: Assignment removed
        '404':
          description: Task not found
  /api/members:
    get:
      summary: List members in the current organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Member list
    post:
      summary: Add a member to the current organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAddRequest'
      responses:
        '201':
          description: Member added
  /api/members/{memberId}:
    patch:
      summary: Update a member role
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MemberIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRoleUpdateRequest'
      responses:
        '200':
          description: Member role updated
    delete:
      summary: Remove a member from the organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MemberIdParam'
      responses:
        '200':
          description: Member removed
  /api/jobs/{id}:
    get:
      summary: Get job status by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobIdParam'
      responses:
        '200':
          description: Job status information
        '403':
          description: Forbidden
        '404':
          description: Job not found
